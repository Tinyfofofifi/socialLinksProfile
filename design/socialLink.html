<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
        <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
        
        <title>Frontend Mentor | Social links profile</title>
        <link rel="stylesheet" href="stylesheet.css">

        <style>
            .attribution { font-size: 0.6875rem; text-align: center; }
            .attribution a { color: hsl(228, 45%, 44%); }
        </style>
    </head>
    <body>
        <div class="block">
            <div class="personal">
                <img src="../assets/images/avatar-jessica.jpeg">
                <h2 class="name"> Jessica Randall </h1>
                <h5 class="location"> London, United Kingdom</h3>
                <p class="comment">"Front-end developer and avid reader."</p>
            </div>
            <div class="buttons">
                <button>GitHub</button>
                <button>Frontend Mentor</button>
                <button>Linkdin</button>
                <button>Twitter</button>
                <button>Instagram</button>
            </div>
        </div>

        <footer class="attribution">
            Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
            Coded by <a href="#">Falak</a>.
        </footer>
    </body>
</html>
